<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>estudo de caso · laís araújo</title>
<link rel="icon" type="image/png" href="Design sem nome (2).png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6e4de;--card:#f4f2ed;--ink:#132c4a;--muted:#5b5f66;--track:#d3d0c8;--yellow:#fbb814;--red:#e30613;--blue:#2e7cc4;--navy:#132c4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1d31;--card:#162a45;--ink:#f1eee6;--muted:#aab4c4;--track:#27405f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1d31;--card:#162a45;--ink:#f1eee6;--muted:#aab4c4;--track:#27405f}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:radial-gradient(rgba(19,44,74,.07) 1px,transparent 1.2px);background-size:7px 7px;color:var(--ink);font-family:'Raleway',system-ui,sans-serif;font-size:17px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{max-width:900px;margin:0 auto;padding:0 20px 70px}
.btn{font:inherit;font-weight:800;font-size:15px;background:var(--navy);color:#f4f2ed;border:0;border-radius:99px;padding:11px 22px;cursor:pointer;text-decoration:none;display:inline-block;transition:transform .12s,background .12s,color .12s}
.btn:hover{background:var(--red)}.btn:active{transform:scale(.96)}
.btn.y{background:var(--yellow);color:#132c4a}.btn.y:hover{background:var(--blue);color:#fff}
/* voltar ao portfólio: azul da identidade ao passar o mouse */
#voltar:hover,#voltar:focus-visible{background:var(--blue);color:#fff}
#theme{border:0;background:var(--track);color:var(--ink);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px}
.top{display:flex;justify-content:space-between;align-items:center;padding:20px 0 8px}

.head{display:flex;gap:22px;align-items:center;padding:20px 0 6px}
.shape{width:84px;height:84px;display:grid;flex:none}.shape i{display:block;width:100%;height:100%}
.s-circle i{border-radius:50%}.s-half{align-items:end}.s-half i{height:50%;border-radius:99px 99px 0 0}.s-quarter i{border-radius:100% 0 0 0}.s-arch i{border-radius:99px 99px 0 0}
.c-yellow i{background:var(--yellow)}.c-red i{background:var(--red)}.c-blue i{background:var(--blue)}.c-navy i{background:var(--navy)}
h1{font-size:clamp(34px,7vw,60px);line-height:1;margin:0;font-weight:800;letter-spacing:-.03em;text-transform:lowercase}
.tag{color:var(--muted);font-weight:600;font-size:18px;margin-top:6px}
h2{font-size:clamp(28px,5vw,38px);font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:40px 0 0;text-transform:lowercase}
.sub{margin:0 0 16px;color:var(--muted);font-weight:600;font-size:18px;line-height:1.3}
  section > h2:not(:has(+ .sub)){margin-bottom:16px}
.cover{width:100%;border-radius:28px;display:block;margin-top:20px}
@media(max-width:560px){.head{flex-direction:column;align-items:flex-start}.shape{width:64px;height:64px}}

.card{background:var(--card);border-radius:28px;padding:22px 24px}
.card p{margin:0 0 14px;max-width:68ch}.card p:last-child{margin-bottom:0}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.k{display:block;font-size:14px;font-weight:800;color:var(--red);text-transform:lowercase}
ul.dots{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
ul.dots li{padding-left:22px;position:relative}
ul.dots li::before{content:"";position:absolute;left:0;top:.5em;width:11px;height:11px;border-radius:50%;background:var(--blue)}

/* persona: foto opcional ao lado do texto */
.persona{display:block}
.p-top{display:flex;gap:22px;align-items:flex-start}
.persona .foto{width:110px;height:110px;border-radius:50%;object-fit:cover;flex:none;display:block}
.persona .info{flex:1;min-width:0}
.persona h3{margin:0 0 4px;font-size:22px;font-weight:800;line-height:1.2}
.persona .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:14px}
@media(max-width:560px){.p-top{flex-direction:column}}

/* ficha da persona: quem é · tempo para estudar · dispositivo */
.ficha{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:20px}
.fi{--sh:#fff;position:relative;overflow:hidden;isolation:isolate;border-radius:28px;padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;min-height:190px;transition:transform .2s;animation:subir .55s both;animation-delay:calc(var(--i,0) * 110ms)}
.fi:hover{transform:translateY(-4px) rotate(-.6deg)}
.fi::before{content:"";position:absolute;z-index:-1;right:-44px;top:-44px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.2);transition:transform .35s}
.fi:hover::before{transform:scale(1.35)}
.f-yellow{background:var(--yellow);color:var(--navy);--sh:var(--navy)}
.f-yellow::before{background:rgba(19,44,74,.09)}
.f-blue{background:var(--blue);color:#fff;--sh:var(--yellow)}
.f-red{background:var(--red);color:#fff;--sh:var(--yellow)}
.fi .fh{display:flex;align-items:center;gap:10px}
.fi .fh .ico{width:34px;height:34px;flex:none;color:var(--sh);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.fi:hover .ico{transform:scale(1.12) rotate(-6deg)}
.fi .bl{font-size:13px;font-weight:800;border-radius:99px;padding:3px 14px;text-transform:lowercase;background:rgba(255,255,255,.22)}
.f-yellow .bl{background:rgba(19,44,74,.14)}
.fi .val{font-size:clamp(24px,4.2vw,30px);font-weight:800;line-height:1.05;letter-spacing:-.02em;text-transform:lowercase}
.fi .det{margin:0;font-weight:600;font-size:15px;line-height:1.3;opacity:.92}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.chips span{font-size:13px;font-weight:800;text-transform:lowercase;border-radius:99px;padding:4px 12px;background:rgba(255,255,255,.22)}
.meter{margin-top:auto}
.meter .tr{height:12px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.meter .tr i{display:block;height:100%;width:var(--w);border-radius:99px;background:var(--yellow);animation:encher 1.1s .35s cubic-bezier(.2,.8,.2,1) both}
.meter small{display:block;margin-top:6px;font-weight:800;font-size:13px;text-transform:lowercase}
@keyframes subir{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes encher{from{width:0}to{width:var(--w)}}

/* objetivos: cartões nas cores da identidade */
.obj{border-radius:28px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;min-height:150px}
.obj .bl{font-size:13px;font-weight:800;border-radius:99px;padding:3px 14px;text-transform:lowercase;background:rgba(255,255,255,.22)}
.obj p{margin:0;font-weight:600;font-size:18px;line-height:1.35}
.o-yellow{background:var(--yellow);color:#132c4a}.o-yellow .bl{background:rgba(19,44,74,.14)}
.o-red{background:var(--red);color:#fff}
.o-blue{background:var(--blue);color:#fff}
.o-navy{background:var(--navy);color:#f4f2ed}

/* ferramentas */
.tool{background:var(--card);border-radius:24px;padding:16px 18px;display:flex;gap:14px;align-items:center}
.tool .shape{width:46px;height:46px}
.tool strong{display:block;font-weight:800;line-height:1.2}
.tool small{color:var(--muted);font-weight:600;font-size:14px;line-height:1.3;display:block;margin-top:2px}

/* fotos do projeto: dois blocos coloridos, botões em pílula, sem bordas */
.blocos{display:grid;gap:24px}
.bloco{--acc:var(--yellow);--txt:#fff;--nc:#fff;position:relative;overflow:hidden;isolation:isolate;background:var(--acc);color:var(--txt);border-radius:36px;padding:34px 26px 26px}
.bloco.k-yellow{--acc:var(--yellow);--txt:var(--navy);--nc:var(--navy)}
.bloco.k-red{--acc:var(--red)}
.bloco.k-blue{--acc:var(--blue)}
.bloco.k-navy{--acc:var(--navy);--txt:#f4f2ed}
/* bola clarinha decorativa no canto */
.bloco{transition:transform .25s;animation:subir .55s both}
.bloco:hover{transform:translateY(-4px) rotate(-.4deg)}
.bloco::before{content:"";position:absolute;z-index:-1;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.2);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.bloco:hover::before{transform:translate(-26px,22px) scale(1.4)}
.bloco.k-yellow::before{background:rgba(19,44,74,.09)}
.bloco h3{margin:0;font-size:clamp(34px,6.5vw,52px);font-weight:800;line-height:1.1;text-transform:lowercase;letter-spacing:-.035em}
.bloco-desc{margin:0 0 16px;max-width:46ch;font-weight:600;font-size:18px;line-height:1.3;opacity:.9}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.link{display:flex;align-items:center;gap:12px;background:var(--card);color:var(--ink);border-radius:24px;padding:16px 22px;text-decoration:none;transition:transform .15s,background .15s,color .15s}
.link .t{display:block;font-weight:800;font-size:16px;line-height:1.2;text-transform:lowercase}
.link .t small{display:block;font-weight:600;font-size:13px;color:var(--muted);margin-top:2px}
.link:hover{background:var(--ink);color:var(--card);transform:translateY(-2px)}
.link:active{transform:scale(.97)}
.link.off{opacity:.5;cursor:default}
.link.off:hover{background:var(--card);color:var(--ink);transform:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <a class="btn" id="voltar" href="../index.html#amostras">voltar ao portfólio</a>
    <button id="theme" aria-label="Alternar tema claro e escuro">◐</button>
  </div>
  <header class="head" id="head"></header>
  <div id="intro"></div>
  <div id="content"></div>
</main>

<script>
/* =====================================================================
   EDITE AQUI. Cada campo é opcional: deixe "" ou [] e a seção some.
   ===================================================================== */
var CASE = {
  voltar: "../index.html#amostras",
  shape: "circle", color: "yellow",     // circle | half | quarter | arch  ·  yellow | red | blue | navy
  title: "joy education",
  tag: "slides, planos de aula e texto interativo",
  capa: "",                              // imagem de capa (ex.: "img/capa.png"), opcional

  /* FOTOS DO PROJETO: em BLOCOS. Cada bloco tem título, uma frase de apoio,
     uma cor (yellow | red | blue | navy) e uma lista de botões.
     Em cada botão: titulo, tipo (aparece ao passar o mouse) e url.
     Se a url ficar "", o botão aparece apagado, como "em breve".
     Para adicionar mais botões, copie uma linha { ... } e cole depois de uma vírgula. */
  fotos: [
    {
      titulo: "estética",
      desc: "materiais desenvolvidos por mim e diagramados por um designer gráfico",
      cor: "yellow",
      botoes: [
        { titulo: "slide",            tipo: "álbum de imagens",       url: "https://drive.google.com/file/d/1PwOjkFxryHEX0FPSzaXjG4gFzMLWQn08/view" },
        { titulo: "plano de aula 1",  tipo: "apresentação",           url: "https://drive.google.com/file/d/1PdfcxY2WTAyKON-wsAiLC99TUll0CUhJ/view" },
        { titulo: "plano de aula 2",  tipo: "experiência interativa", url: "https://drive.google.com/file/d/17XRwg1xeugOzRgCsXduA9wmRS6Fur8_W/view" },
        { titulo: "texto interativo", tipo: "documento em PDF",       url: "https://slides.com/administrador/ht1_tecnologiasavanadas_esttica_proz?token=7no4LpMb" },
        { titulo: "texto interativo", tipo: "documento em PDF",       url: "https://slides.com/administrador/ht1_atendimentohumanizado_esttica_proz?token=c_smUI2A" }
      ]
    },
    {
      titulo: "tecnologia",
      desc: "materiais desenvolvidos por mim e diagramados por um designer gráfico",
      cor: "blue",
      botoes: [
        { titulo: "plano de aula 1",  tipo: "álbum de imagens",       url: "https://drive.google.com/file/d/1TROgAxUO5iIRfDY0fW488Lvk4YQS7DYl/view" },
        { titulo: "plano de aula 2",  tipo: "apresentação",           url: "https://drive.google.com/file/d/1ssr4Cey7sXZyVOoLVCkSroLMODFvmG3W/view" },
        { titulo: "slide",            tipo: "experiência interativa", url: "https://drive.google.com/file/d/1DdTVcTU4Mst60sH8_zejFUsvlSI4X0aH/view?usp=sharing" }
      ]
    }
  ],

  /* DESCRIÇÃO DO PROJETO: cada texto entre aspas vira um parágrafo */
  descricao: [
    "durante o meu cargo de designer instrucional na joy education, eu desenvolvi alguns planos de aula para diversas aulas de estética e tecnologia. o nosso objetivo principal era unir a diversão, a interatividade e o dinamismo nas aulas, focados na gamificação e atividades lúdicas. dessa forma, conseguíamos desenvolver um conteúdo que fosse engajante e interessante para os alunos."
  ],

  /* PARA QUEM EU CRIEI: persona ou descrição do público.
     A ficha (quem, tempo, dispositivo) aparece em três cartões coloridos.
     Cada parte é opcional: apague uma e o cartão some.
       quem:        { titulo, detalhe }
       tempo:       { titulo, detalhe, momentos: ["...", "..."] }   (momentos viram etiquetas)
       dispositivo: { titulo, detalhe, uso: 85, usoTexto: "..." }   (uso é um número de 0 a 100 e vira uma barra) */
  persona: {
    nome: "beatriz, 22 anos",
    foto: "ícone persona.png",           // nome da sua imagem, ou "" para ficar sem foto
    perfil: "estudante do curso técnico em estética, em recife. trabalha como recepcionista em um salão de beleza e quer, no futuro, abrir seu próprio espaço.",
    quem: {
      titulo: "estudante de estética",
      detalhe: "curso técnico em recife. trabalha como recepcionista em um salão de beleza."
    },
    tempo: {
      titulo: "5 horas por semana",
      detalhe: "estuda em momentos curtos, entre uma tarefa e outra.",
      momentos: ["no ônibus", "no intervalo", "à noite"]
    },
    dispositivo: {
      titulo: "celular android",
      detalhe: "plano de dados limitado.",
      uso: 85,
      usoTexto: "do estudo acontece no celular"
    }
  },

  /* OBJETIVOS DE APRENDIZAGEM. nivel (Bloom): lembrar, entender, aplicar, analisar, avaliar, criar.
     As cores dos cartões alternam entre amarelo, vermelho, azul e azul-marinho. */
  objetivos: [
    { nivel: "entender", texto: "[Explicar as etapas do processo de atendimento.]" },
    { nivel: "aplicar",  texto: "[Aplicar o roteiro de abordagem em simulações.]" },
    { nivel: "analisar", texto: "[Analisar casos reais e identificar erros comuns.]" }
  ],

  /* FERRAMENTAS QUE UTILIZEI: nome + para que usou (uso é opcional) */
  ferramentas: [
    { nome: "Articulate Storyline", uso: "[autoria das telas interativas]" },
    { nome: "Canva", uso: "[identidade visual e infográficos]" },
    { nome: "Moodle", uso: "[publicação e acompanhamento]" }
  ]
};
/* ===================== fim da área de edição ===================== */

var $ = function(id){return document.getElementById(id)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function url(u){return /^\s*javascript:/i.test(u)?"#":esc(u)}
function has(a){return a&&a.length}
function list(a){return '<ul class="dots">'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul>'}

var C = CASE, secs = [], COLS = ["yellow","red","blue","navy"], SHAPES = ["circle","half","quarter","arch"];
function sec(id,label,title,sub,html){
  secs.push([id,label]);
  return '<section id="'+id+'"><h2>'+title+'</h2>'+(sub?'<p class="sub">'+sub+'</p>':'')+html+'</section>';
}

/* um botão: com url vira link; sem url fica apagado ("em breve") */
function botao(b,i){
  var n = '';
  var t = '<span class="t">'+esc(b.titulo)+(b.url?'':'<small>em breve</small>')+'</span>';
  if(!b.url){
    return '<div class="link off" aria-disabled="true">'+n+t+'</div>';
  }
  return '<a class="link" href="'+url(b.url)+'" target="_blank" rel="noopener" title="'+esc(b.tipo||"abrir em nova aba")+'">'+n+t+'</a>';
}

/* um bloco (estética ou tecnologia) */
function bloco(b,i){
  var co = b.cor||COLS[i%4], bt = b.botoes||[];
  return '<div class="bloco k-'+esc(co)+'">'+
    '<h3>'+esc(b.titulo)+'</h3>'+
    (b.desc?'<p class="bloco-desc">'+esc(b.desc)+'</p>':'')+
    '<div class="links">'+bt.map(botao).join("")+'</div></div>';
}

/* ficha da persona: três cartões coloridos (quem é, tempo para estudar, dispositivo) */
var ICONES = {
  pessoa: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
  relogio: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
  celular: '<rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/>'
};
function ficha(p){
  var cards = [], n = 0;
  function card(cor,icone,rotulo,d,extra){
    var i = n++;
    return '<div class="fi f-'+cor+'" style="--i:'+i+'">'+
      '<div class="fh"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true">'+ICONES[icone]+'</svg><span class="bl">'+rotulo+'</span></div>'+
      '<div class="val">'+esc(d.titulo||"")+'</div>'+
      (d.detalhe?'<p class="det">'+esc(d.detalhe)+'</p>':'')+
      (extra||'')+'</div>';
  }
  if(p.quem && p.quem.titulo) cards.push(card("yellow","pessoa","quem é",p.quem));
  if(p.tempo && p.tempo.titulo){
    var m = has(p.tempo.momentos) ? '<div class="chips">'+p.tempo.momentos.map(function(x){return '<span>'+esc(x)+'</span>'}).join("")+'</div>' : '';
    cards.push(card("blue","relogio","tempo para estudar",p.tempo,m));
  }
  if(p.dispositivo && p.dispositivo.titulo){
    var d = p.dispositivo, u = Math.max(0,Math.min(100,Number(d.uso)||0));
    var bar = u ? '<div class="meter"><div class="tr"><i style="--w:'+u+'%"></i></div><small>'+u+'% '+esc(d.usoTexto||"")+'</small></div>' : '';
    cards.push(card("red","celular","dispositivo",d,bar));
  }
  return cards.length ? '<div class="ficha">'+cards.join("")+'</div>' : '';
}

function render(){
  var h = "";
  document.title = C.title+" · laís araújo";
  $("voltar").href = C.voltar||"../index.html";
  $("head").innerHTML = '<div><h1>'+esc(C.title)+'</h1><div class="tag">'+esc(C.tag)+'</div></div>';
  $("intro").innerHTML = C.capa?'<img class="cover" src="'+esc(C.capa)+'" alt="Capa: '+esc(C.title)+'">':'';

  if(has(C.descricao)) h += sec("descricao","descrição","sobre o projeto","",'<div class="card">'+C.descricao.map(function(t){return '<p>'+esc(t)+'</p>'}).join("")+'</div>');

  if(has(C.fotos)) h += sec("fotos","fotos","fotos do projeto","exemplos de materiais desenvolvidos",
    '<div class="blocos">'+C.fotos.map(bloco).join("")+'</div>');

  var p = C.persona;
  if(p && p.nome){
    var foto = p.foto ? '<img class="foto" src="'+esc(p.foto)+'" alt="'+esc(p.nome)+'">' : '';
    h += sec("publico","para quem criei","para quem eu criei","",
      '<div class="card persona"><div class="p-top">'+foto+'<div class="info"><h3>'+esc(p.nome)+'</h3>'+(p.perfil?'<p>'+esc(p.perfil)+'</p>':'')+
      '<div class="cols">'+(has(p.dores)?'<div><span class="k">dores</span>'+list(p.dores)+'</div>':'')+(has(p.necessidades)?'<div><span class="k">necessidades</span>'+list(p.necessidades)+'</div>':'')+'</div></div></div>'+
      ficha(p)+'</div>');
  }

  if(has(C.objetivos)) h += sec("objetivos","objetivos","objetivos de aprendizagem","ao final, a pessoa será capaz de…",
    '<div class="grid g2">'+C.objetivos.map(function(o,i){return '<div class="obj o-'+COLS[i%4]+'"><span class="bl">'+esc(o.nivel||"")+'</span><p>'+esc(o.texto)+'</p></div>'}).join("")+'</div>');

  if(has(C.ferramentas)) h += sec("ferramentas","ferramentas","ferramentas que utilizei","",
    '<div class="grid g2">'+C.ferramentas.map(function(t,i){return '<div class="tool"><span class="shape s-'+SHAPES[i%4]+' c-'+COLS[i%4]+'" aria-hidden="true"><i></i></span><div><strong>'+esc(t.nome)+'</strong>'+(t.uso?'<small>'+esc(t.uso)+'</small>':'')+'</div></div>'}).join("")+'</div>');

  $("content").innerHTML = h;
}

$("theme").addEventListener("click",function(){
  var r = document.documentElement, dark = r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);
  r.setAttribute("data-theme",dark?"light":"dark");
});
render();
</script>
</body>
</html>
